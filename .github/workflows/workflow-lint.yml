name: Workflow lint

# Lints the caller's GitHub Actions files with actionlint (which also runs
# shellcheck on the `run:` scripts) and zizmor. Both read the caller's own
# `.github/actionlint.yaml` and `zizmor.yml` when present. Uses only
# `GITHUB_TOKEN` with `contents: read`. Other repos call it with
# `uses: valuecodes/automation/.github/workflows/workflow-lint.yml@<sha>`.

on:
  workflow_call:

permissions: {}

# One job per tool, so a failed check names the tool and the two run in
# parallel. Callers see `<their job> / actionlint` and `<their job> / zizmor`.
jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Checks out the caller repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint has no official action; download the release binary and
      # verify its checksum. shellcheck is preinstalled on the runner, so
      # actionlint also checks the `run:` scripts.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Checks out the caller repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # The action defaults to the latest zizmor; pin it.
          version: 1.30.1
          # The default uploads SARIF, which needs `security-events: write`.
          advanced-security: false
          annotations: true
