name: CI

# Checks formatting with oxfmt and lints the workflow files through this repo's
# own `workflow-lint.yml`. The `ci` job is the check to require on `main`.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # zizmor prefers the `$/` self-repository syntax, but actionlint 1.7.12
      # rejects it; switch once actionlint accepts `$/`.
      - name: Setup
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]

      - name: oxfmt
        run: pnpm format:check

  # Runs the reusable workflow at this commit, so a change to it is checked on
  # its own PR. Same `$/` caveat as the setup action above.
  workflow-lint:
    permissions:
      contents: read
    uses: ./.github/workflows/workflow-lint.yml # zizmor: ignore[self-repository]

  # The one check to require on `main`. `if: always()` makes it run even when a
  # needed job failed, so it reports a failure instead of skipping.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: always()
    needs: [format, workflow-lint]
    permissions: {}
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for r in $RESULTS; do
            if [[ $r != success ]]; then
              echo "::error::A required job ended with: $r."
              exit 1
            fi
          done
