name: CI

# Checks formatting with oxfmt and lints the workflow files with actionlint and
# zizmor. The job is named `ci` so it can be a required check on `main`.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # zizmor prefers the `$/` self-repository syntax, but actionlint 1.7.12
      # rejects it; switch once actionlint accepts `$/`.
      - name: Setup
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]

      - name: oxfmt
        run: pnpm format:check

      # actionlint has no official action; download the release binary and
      # verify its checksum. shellcheck is preinstalled on the runner, so
      # actionlint also checks the `run:` scripts.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # The action defaults to the latest zizmor; pin it.
          version: 1.30.1
          # The default uploads SARIF, which needs `security-events: write`.
          advanced-security: false
          annotations: true
