name: CI

# Checks formatting with oxfmt, shellchecks `scripts/`, lints the workflow
# files through this repo's own `workflow-lint.yml` and runs the dashboard and
# the update PRs against this repo in dry-run mode. The `ci` job is the check
# to require on `main`.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # zizmor prefers the `$/` self-repository syntax, but actionlint 1.7.12
      # rejects it; switch once actionlint accepts `$/`.
      - name: Setup
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]

      - name: oxfmt
        run: |
          set -euo pipefail
          pnpm format:check

      # actionlint only covers the `run:` scripts inside workflows; the runner
      # ships shellcheck for the standalone scripts.
      - name: shellcheck
        run: |
          set -euo pipefail
          shellcheck scripts/*.sh

  # Runs the reusable workflows at this commit, so a change to one is checked
  # on its own PR. Same `$/` caveat as the setup action above.
  workflow-lint:
    permissions:
      contents: read
    uses: ./.github/workflows/workflow-lint.yml # zizmor: ignore[self-repository]

  # The dashboard only ever writes issues in caller repos, so this is the one
  # place its steps run before a caller re-pins. Dry run builds the body into
  # the run summary and touches no issue; `issues: write` is still needed
  # because a called job's permissions are checked against the caller's. A
  # failed check (including an npm or osv.dev outage) makes this red on purpose.
  maintenance-dashboard:
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/maintenance-dashboard.yml # zizmor: ignore[self-repository]
    with:
      dry-run: true

  # The same for the update PRs: dry run plans each PR against this repo's
  # default branch into the run summary and pushes nothing. The write grants
  # are checked against the called jobs' permissions, as above.
  maintenance-updates:
    permissions:
      contents: write
      pull-requests: write
      actions: write
      issues: read
    uses: ./.github/workflows/maintenance-updates.yml # zizmor: ignore[self-repository]
    with:
      dry-run: true

  # The one check to require on `main`. `if: always()` makes it run even when a
  # needed job failed, so it reports a failure instead of skipping.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: always()
    needs: [format, workflow-lint, maintenance-dashboard, maintenance-updates]
    permissions: {}
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for r in $RESULTS; do
            if [[ $r != success ]]; then
              echo "::error::A required job ended with: $r."
              exit 1
            fi
          done
