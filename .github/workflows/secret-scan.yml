name: Secret scan

# Scans the caller's full git history for committed secrets with gitleaks,
# at the version pinned below, so every caller scans with the same rules and
# gets a bump by re-pinning this workflow. gitleaks reads the caller's own
# `.gitleaks.toml` at the repo root when present (config, not code: no repo
# code runs). Uses only `GITHUB_TOKEN` with `contents: read`. Other repos call
# it with `uses: valuecodes/maintain-kit/.github/workflows/secret-scan.yml@<sha>`.

on:
  workflow_call:

permissions: {}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Checks out the caller repo. Full history: every commit is scanned, not
      # just the checked-out tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The runner has no gitleaks; download the release binary and verify its
      # checksum. Bump both values together: the sha256 is the linux_x64 line
      # of the release's `gitleaks_<version>_checksums.txt`.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          # Findings exit 2 (`--exit-code`), so a gitleaks that failed to run
          # (a broken `.gitleaks.toml`, say) is not reported as a leak.
          rc=0
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --exit-code 2 "$GITHUB_WORKSPACE" || rc=$?
          if (( rc == 2 )); then
            echo "::error::gitleaks found a secret in the git history. Rotate it and remove it from the history, or allowlist a known false positive in .gitleaks.toml."
            exit 1
          elif (( rc != 0 )); then
            echo "::error::gitleaks failed to run (exit $rc); see its output above."
            exit 1
          fi
