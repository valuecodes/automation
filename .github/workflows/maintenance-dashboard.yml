name: Maintenance dashboard

# Keeps one issue per repo (label `maintenance-dashboard`, title
# `Maintenance dashboard: <worst state>`) listing pending updates: the
# `catalog:` in `pnpm-workspace.yaml`, pnpm, gitleaks, Node.js, `pnpm audit`
# findings, osv.dev malicious-package hits and update signals. The title and
# body are recomputed every run and edited only when they changed. No PRs, no
# commits; `maintenance-updates.yml` opens PRs for the updates on the current
# major. Uses only `GITHUB_TOKEN`: files are read
# through the REST API, and `pnpm audit` runs from the lockfile without
# installing. Other repos call it with
# `uses: valuecodes/automation/.github/workflows/maintenance-dashboard.yml@<sha>`.

on:
  workflow_call:
    inputs:
      min-release-age-days:
        description: Minimum age of a listed release (npm, pnpm, gitleaks, Node.js).
        type: number
        default: 14
      gitleaks-script:
        description: File holding `GITLEAKS_VERSION="x.y.z"`. Empty skips the check.
        type: string
        default: .github/scripts/secrets-scan.sh
      dry-run:
        description: Write the body to the run summary only; leave the issue and label alone.
        type: boolean
        default: false

permissions: {}

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Checks out the caller repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # Only this workflow file reaches the runner, so the steps are checked
      # out from this repo at the commit the caller pinned, which
      # `job.workflow_sha` names (see the other job). The caller's checkout
      # above is left in place: this one lands in a subdirectory.
      - name: Find the commit of this workflow
        id: self
        env:
          JOB: ${{ toJSON(job) }}
        run: |
          set -euo pipefail
          sha=$(jq -r '.workflow_sha // ""' <<<"$JOB")
          if [[ ! $sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::job.workflow_sha is not a commit SHA (got '$sha'), so the dashboard scripts cannot be checked out."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out the dashboard scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: valuecodes/automation
          ref: ${{ steps.self.outputs.sha }}
          path: .automation
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .automation/.nvmrc

      # Is this a pnpm project, and every registry package in its lockfile,
      # for the osv.dev check in the other job. Git and tarball entries have
      # no registry version and are only counted, so the section can say how
      # many were not checked.
      - name: List the locked packages
        id: detect
        run: |
          set -euo pipefail
          node .automation/src/dashboard/main.ts lockfile

      - name: Set up pnpm
        if: steps.detect.outputs.pnpm == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Run pnpm audit
        if: steps.detect.outputs.pnpm == 'true'
        run: |
          set -euo pipefail
          node .automation/src/dashboard/main.ts audit

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintenance-dashboard-audit
          path: ${{ runner.temp }}/audit
          retention-days: 1
          if-no-files-found: error

  dashboard:
    name: update-issue
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    # Runs that edit the issue go one at a time per repo. A dry run writes
    # nothing shared, and GitHub cancels a pending job when a newer one joins
    # its group, so dry runs (one per CI run here) each get their own group.
    concurrency:
      group: ${{ inputs.dry-run && format('maintenance-dashboard-dry-run-{0}', github.run_id) || format('maintenance-dashboard-{0}', github.repository) }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      SERVER_URL: ${{ github.server_url }}
      RUN_ID: ${{ github.run_id }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      MIN_AGE_DAYS: ${{ inputs.min-release-age-days }}
      GITLEAKS_SCRIPT: ${{ inputs.gitleaks-script }}
      DRY_RUN: ${{ inputs.dry-run }}
    steps:
      - name: Download the audit result
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maintenance-dashboard-audit
          path: ${{ runner.temp }}/audit

      # Only this workflow file reaches the runner, so the scripts that build
      # the sections are checked out from this repo at the commit the caller
      # pinned, which `job.workflow_sha` names. actionlint does not know that
      # property yet, so it is read from the job object and checked first.
      - name: Find the commit of this workflow
        id: self
        env:
          JOB: ${{ toJSON(job) }}
        run: |
          set -euo pipefail
          sha=$(jq -r '.workflow_sha // ""' <<<"$JOB")
          if [[ ! $sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::job.workflow_sha is not a commit SHA (got '$sha'), so the dashboard scripts cannot be checked out."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out the dashboard scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: valuecodes/automation
          ref: ${{ steps.self.outputs.sha }}
          path: .automation
          persist-credentials: false
          fetch-depth: 1

      # The scripts are TypeScript that Node.js runs as is (type stripping),
      # with no packages to install.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .automation/.nvmrc

      # Each section step writes `$RUNNER_TEMP/sections/NN-name.md` and, last,
      # a one-line `NN-name.status` (`state<TAB>status<TAB>details`, state one
      # of ok, na, update, warn, alert, failed) for the summary table. The
      # table shows a fixed word per state next to the details, so the details
      # carry the one fact worth reading (a count, a version, a reason) and
      # the status text is a short phrase for logs. A step never stops the
      # others; the last step treats a missing fragment or status as a failed
      # check. The code is in `src/dashboard/`, one module per step.
      - name: Read the repo files at this commit
        continue-on-error: true
        run: |
          set -euo pipefail
          node .automation/src/dashboard/main.ts setup

      - name: "Section: security (pnpm audit)"
        continue-on-error: true
        run: |
          set -euo pipefail
          node .automation/src/dashboard/main.ts security

      - name: "Section: dependencies (catalog)"
        continue-on-error: true
        run: |
          set -euo pipefail
          node .automation/src/dashboard/main.ts catalog

      # Runs after the catalog step because it reuses its rows and packuments.
      - name: "Section: supply chain"
        continue-on-error: true
        run: |
          set -euo pipefail
          node .automation/src/dashboard/main.ts supply-chain

      - name: "Section: pnpm"
        continue-on-error: true
        run: |
          set -euo pipefail
          node .automation/src/dashboard/main.ts pnpm

      - name: "Section: gitleaks"
        continue-on-error: true
        run: |
          set -euo pipefail
          node .automation/src/dashboard/main.ts gitleaks

      - name: "Section: Node.js"
        continue-on-error: true
        run: |
          set -euo pipefail
          node .automation/src/dashboard/main.ts node

      - name: Update the dashboard issue
        run: |
          set -euo pipefail
          node .automation/src/dashboard/main.ts issue
