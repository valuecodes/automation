name: Maintenance updates

# Keeps one PR per update kind open in the calling repo, on the branch
# `maintenance-updates/<kind>`: Node.js (`.nvmrc`), pnpm (`packageManager`)
# and the `catalog:` in `pnpm-workspace.yaml` with its lockfile. Only updates
# on the current major are
# proposed; majors stay on the maintenance dashboard. Every run recomputes each
# update from the default branch and updates its PR in place, or closes it when
# nothing is due any more. Uses only `GITHUB_TOKEN`: commits are made through
# the REST API, and the one checkout of the caller (pnpm and catalog) resolves
# the lockfile without installing or running repo code. The steps are
# TypeScript in `src/updates/`, checked out from this repo at the commit the
# caller pinned. Other repos call it with
# `uses: valuecodes/automation/.github/workflows/maintenance-updates.yml@<sha>`.

on:
  workflow_call:
    inputs:
      min-release-age-days:
        description: Minimum age of a proposed release (npm, pnpm, Node.js).
        type: number
        default: 14
      ci-workflow:
        description: Workflow file to start on each pushed update branch (needs `workflow_dispatch`). Empty starts none.
        type: string
        default: ""
      dry-run:
        description: Write the planned PRs to the run summary only; push nothing and open or close no PR.
        type: boolean
        default: false

permissions: {}

jobs:
  update:
    # Each kind is its own job, so a failed check names its cause and one broken
    # kind never holds back another's PR.
    name: ${{ matrix.kind }}
    strategy:
      fail-fast: false
      matrix:
        kind: [node, pnpm, catalog]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
      issues: read
    # One run at a time per repo and kind, since each owns one branch and PR. A
    # dry run writes nothing shared, so it gets its own group (see the dashboard).
    concurrency:
      group: ${{ inputs.dry-run && format('maintenance-updates-dry-run-{0}-{1}', github.run_id, matrix.kind) || format('maintenance-updates-{0}-{1}', github.repository, matrix.kind) }}
      cancel-in-progress: false
    # `GH_TOKEN` is set only on the steps that call the API, so the step that
    # runs pnpm in the caller's checkout never sees a write token.
    env:
      REPO: ${{ github.repository }}
      SERVER_URL: ${{ github.server_url }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      KIND: ${{ matrix.kind }}
      MIN_AGE_DAYS: ${{ inputs.min-release-age-days }}
      CI_WORKFLOW: ${{ inputs.ci-workflow }}
      DRY_RUN: ${{ inputs.dry-run }}
      # The caller's checkout for the lockfile, in a subdirectory: a checkout
      # at the workspace root would delete `.automation/` first.
      CHECKOUT: ${{ github.workspace }}/caller
    steps:
      # Only this workflow file reaches the runner, so the steps are checked
      # out from this repo at the commit the caller pinned, which
      # `job.workflow_sha` names. actionlint does not know that property yet,
      # so it is read from the job object and checked first.
      - name: Find the commit of this workflow
        id: self
        env:
          JOB: ${{ toJSON(job) }}
        run: |
          set -euo pipefail
          sha=$(jq -r '.workflow_sha // ""' <<<"$JOB")
          if [[ ! $sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::job.workflow_sha is not a commit SHA (got '$sha'), so the update steps cannot be checked out."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out the update steps
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: valuecodes/automation
          ref: ${{ steps.self.outputs.sha }}
          path: .automation
          persist-credentials: false
          fetch-depth: 1

      # The steps are TypeScript that Node.js runs as is (type stripping),
      # with no packages to install.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .automation/.nvmrc

      # Each kind's steps hand each other files under `$RUNNER_TEMP/update`:
      # `state` (`update`, `current`, `na` or `blocked`, with a reason) and,
      # for an update, `title` (the PR title, a plain sentence), `content.md`,
      # the changed `paths` with each one's `old/` and `new/` content, and
      # optionally `osv-queries.jsonl` and `summary.md` (run summary only).
      # The last step turns that into a commit and a PR. This step also saves
      # this job's Node.js as `AUTOMATION_NODE`, since the caller's own may
      # replace it on PATH below.
      - name: Read the repo files on the default branch
        id: setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node .automation/src/updates/main.ts setup

      - name: "Node.js: find the update"
        if: matrix.kind == 'node'
        run: |
          set -euo pipefail
          node .automation/src/updates/main.ts node

      - name: "pnpm: find the update"
        if: matrix.kind == 'pnpm'
        run: |
          set -euo pipefail
          node .automation/src/updates/main.ts pnpm

      - name: "Dependencies: pick the updates"
        if: matrix.kind == 'catalog'
        run: |
          set -euo pipefail
          node .automation/src/updates/main.ts catalog

      # The only checkout of the caller, for the kinds that change
      # `pnpm-lock.yaml`: catalog, and pnpm, since a pnpm 10+ lockfile pins
      # pnpm itself and `--frozen-lockfile` fails when that pin is stale.
      # Credentials are not kept, and no step after it that runs in the
      # checkout has a token.
      - name: "Lockfile: check out the default branch"
        if: env.RESOLVE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.setup.outputs.base-sha }}
          path: caller
          persist-credentials: false
          fetch-depth: 1

      - name: "Lockfile: set up pnpm"
        if: env.RESOLVE == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: caller/package.json

      - name: "Lockfile: set up Node.js"
        if: env.RESOLVE == 'true' && hashFiles('caller/.nvmrc') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: caller/.nvmrc

      # Resolves without installing: nothing is downloaded or unpacked, and
      # neither lifecycle scripts nor `.pnpmfile.cjs` run. The pnpm that runs
      # must be the one the repo pinned before this update. A failed
      # resolution leaves its evidence in the run summary.
      - name: "Lockfile: resolve"
        if: env.RESOLVE == 'true'
        run: |
          set -euo pipefail
          "$AUTOMATION_NODE" .automation/src/updates/main.ts resolve

      # The resolve step ran the caller's pnpm in the caller's tree without a
      # token, and the steps after it run with the write token from the
      # scripts checkout, so that checkout must still be the pinned commit.
      # This is a sanity check, not a security boundary: a process that can
      # edit the checkout can defeat a git check too, and getting code to run
      # in that step already takes commit access to the caller's default
      # branch. `--really-refresh` ignores the assume-unchanged bit.
      - name: Check that the update steps are still the pinned commit
        env:
          SHA: ${{ steps.self.outputs.sha }}
        run: |
          set -euo pipefail
          git -C .automation update-index --really-refresh -q >/dev/null || true
          head=$(git -C .automation rev-parse HEAD)
          # One line, since an annotation shows only the first.
          changed=$(git -C .automation status --porcelain --untracked-files=all | tr '\n' ' ')
          if [[ $head != "$SHA" || -n $changed ]]; then
            echo "::error::The checkout of the update steps (.automation) changed after it was made (HEAD $head, pinned $SHA${changed:+, changed files: $changed}), so the steps that hold the token did not run."
            exit 1
          fi

      # The OpenSSF malicious-packages feed on osv.dev, for every npm version
      # an update adds (the pnpm target, or each new locked version). A hit
      # blocks the update and closes its open PR.
      - name: Check the new versions on osv.dev
        run: |
          set -euo pipefail
          "$AUTOMATION_NODE" .automation/src/updates/main.ts osv

      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$AUTOMATION_NODE" .automation/src/updates/main.ts pr
